# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "coding-challenge-bundle"

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    # mode: production on purpose: this target manages the live, single-copy
    # resources (bound via `bundle generate --bind`), and 'development' mode would
    # rename them with a "[dev <user>]" prefix and pause triggers on each deploy.
    mode: production
    default: true
    workspace:
      host: https://dbc-0d7ce7d9-b8fc.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
